<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Insights & Blog | Dr. Kunwar Mrityunjai Sharma</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-subtle: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #475569;
            --primary: #0f4c81;
            --primary-hover: #0a365c;
            --accent: #0284c7;
            --accent-subtle: #e0f2fe;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --font-code: 'Fira Code', monospace;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text); font-family: var(--font-main); line-height: 1.6; }
        
        nav {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 6%; display: flex; justify-content: space-between; align-items: center;
        }
        nav a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; }
        nav a:hover { color: var(--primary-hover); text-decoration: underline; }
        
        .container { max-width: 1000px; margin: 3rem auto; padding: 0 6%; }
        h1 { font-size: 2.25rem; color: var(--primary); margin-bottom: 0.4rem; letter-spacing: -0.02em; }
        p.subtitle { color: var(--text-muted); margin-bottom: 2.5rem; font-size: 1.05rem; }
        
        .blog-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--card-shadow);
            transition: border-color 0.2s, transform 0.2s;
        }
        .blog-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .blog-meta { font-family: var(--font-code); font-size: 0.8rem; color: var(--accent); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .blog-title { font-size: 1.35rem; font-weight: 700; color: var(--text); margin-bottom: 0.8rem; }
        .blog-excerpt { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.2rem; }
        .read-more { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; }
        .read-more:hover { color: var(--primary-hover); text-decoration: underline; }

        .status-message {
            color: var(--text-muted);
            font-family: var(--font-code);
            font-size: 0.9rem;
            padding: 2rem 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <div><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a></div>
        <div style="color: var(--primary); font-weight: 700;">Research Insights & Blog</div>
    </nav>

    <div class="container">
        <h1>Research Insights & Technical Notes</h1>
        <p class="subtitle">Articles on computational hydrogeology, Channel Network Modeling, unsaturated soil mechanics, and radioactive waste safety assessments.</p>

        <!-- Dynamic Container for Notion Articles -->
        <div id="blogContainer">
            <div class="status-message">
                <i class="fa-solid fa-spinner fa-spin"></i> Fetching latest articles from Notion...
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://notion-blog-proxy.sharmamrityunjai.workers.dev";

        async function fetchNotionBlogPosts() {
            const container = document.getElementById('blogContainer');

            try {
                const response = await fetch(WORKER_URL);
                const data = await response.json();
                const posts = data.results || data;

                if (!posts || posts.length === 0) {
                    container.innerHTML = `
                        <div class="status-message">
                            <i class="fa-solid fa-circle-info"></i> No published articles found in database.
                        </div>
                    `;
                    return;
                }

                container.innerHTML = posts.map(page => {
                    const props = page.properties || {};
                    const pageId = page.id;

                    const titleProperty = Object.values(props).find(prop => prop.type === 'title');
                    const title = titleProperty?.title[0]?.plain_text || page.title || "Untitled Article";

                    const dateRaw = props.Date?.date?.start || page.date || "";
                    let formattedDate = "";
                    if (dateRaw) {
                        const dateObj = new Date(dateRaw);
                        formattedDate = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
                    }

                    const category = props.Type?.select?.name || props.Category?.select?.name || "Subsurface Modeling";
                    const summary = props.Summary?.rich_text[0]?.plain_text || page.summary || "No summary provided.";

                    return `
                        article class="blog-card">
                            <div class="blog-meta">${formattedDate ? formattedDate + ' • ' : ''}${category}</div>
                            <h2 class="blog-title">${title}</h2>
                            <p class="blog-excerpt">${summary}</p>
                            <a href="post.html?id=${pageId}" class="read-more">Read Full Article <i class="fa-solid fa-arrow-right"></i></a>
                        </article>
                    `;
                }).join('');

            } catch (err) {
                console.error("Error fetching posts from Notion Worker:", err);
                container.innerHTML = `
                    <div class="status-message" style="color: #ef4444;">
                        <i class="fa-solid fa-triangle-exclamation"></i> Unable to load blog posts at this time.
                    </div>
                `;
            }
        }

        document.addEventListener("DOMContentLoaded", fetchNotionBlogPosts);
    </script>
</body>
</html>
