<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | Dr. Kunwar Mrityunjai Sharma</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-subtle: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #475569;
            --primary: #0f4c81;
            --primary-hover: #0a365c;
            --accent: #0284c7;
            --accent-subtle: #e0f2fe;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --font-code: 'Fira Code', monospace;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text); font-family: var(--font-main); line-height: 1.8; }
        
        nav {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 6%; display: flex; justify-content: space-between; align-items: center;
        }
        nav a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; }
        nav a:hover { color: var(--primary-hover); text-decoration: underline; }
        
        .container { max-width: 800px; margin: 3rem auto; padding: 0 6%; }
        
        .post-header { margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        .post-meta { font-family: var(--font-code); font-size: 0.85rem; color: var(--accent); margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .post-title { font-size: 2.2rem; font-weight: 700; line-height: 1.3; margin-bottom: 1rem; color: var(--primary); letter-spacing: -0.02em; }
        
        .post-content { font-size: 1.05rem; color: var(--text); }
        .post-content h1, .post-content h2, .post-content h3 { color: var(--primary); margin: 2rem 0 1rem 0; font-weight: 700; }
        .post-content h1 { font-size: 1.75rem; }
        .post-content h2 { font-size: 1.4rem; }
        .post-content h3 { font-size: 1.2rem; color: var(--text); }
        .post-content p { margin-bottom: 1.4rem; color: var(--text-muted); }
        .post-content ul, .post-content ol { margin: 0 0 1.4rem 1.5rem; color: var(--text-muted); }
        .post-content li { margin-bottom: 0.4rem; }
        
        .post-content blockquote { 
            border-left: 3px solid var(--accent); 
            padding: 0.8rem 1.2rem; 
            margin: 1.5rem 0; 
            background: var(--accent-subtle); 
            border-radius: 0 8px 8px 0;
            color: var(--text);
            font-style: italic;
        }

        .post-content pre { 
            background: #0f172a; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 1.2rem; 
            overflow-x: auto; 
            font-family: var(--font-code); 
            font-size: 0.9rem; 
            margin: 1.5rem 0; 
            color: #38bdf8;
        }

        .post-content code { 
            font-family: var(--font-code); 
            background: var(--surface-subtle); 
            padding: 0.2rem 0.4rem; 
            border-radius: 4px; 
            font-size: 0.9em; 
            color: var(--primary);
            border: 1px solid var(--border);
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
        }

        .status-message {
            color: var(--text-muted);
            font-family: var(--font-code);
            font-size: 0.9rem;
            padding: 3rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <div><a href="blog.html"><i class="fa-solid fa-arrow-left"></i> Back to Blog</a></div>
        <div style="color: var(--primary); font-weight: 700;">Research Insights</div>
    </nav>

    <div class="container">
        <div id="postContainer">
            <div class="status-message">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading article content...
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://notion-blog-proxy.sharmamrityunjai.workers.dev";

        function renderRichText(richTextArray) {
            if (!richTextArray || richTextArray.length === 0) return '';
            return richTextArray.map(item => {
                let text = item.plain_text || '';
                if (item.annotations?.bold) text = `<strong>${text}</strong>`;
                if (item.annotations?.italic) text = `<em>${text}</em>`;
                if (item.annotations?.code) text = `<code>${text}</code>`;
                if (item.annotations?.strikethrough) text = `<del>${text}</del>`;
                if (item.href) text = `<a href="${item.href}" target="_blank" style="color: var(--accent);">${text}</a>`;
                return text;
            }).join('');
        }

        function renderBlock(block) {
            const type = block.type;
            const value = block[type];

            switch (type) {
                case 'paragraph':
                    return `<p>${renderRichText(value.rich_text)}</p>`;
                case 'heading_1':
                    return `<h1>${renderRichText(value.rich_text)}</h1>`;
                case 'heading_2':
                    return `<h2>${renderRichText(value.rich_text)}</h2>`;
                case 'heading_3':
                    return `<h3>${renderRichText(value.rich_text)}</h3>`;
                case 'bulleted_list_item':
                    return `<ul><li>${renderRichText(value.rich_text)}</li></ul>`;
                case 'numbered_list_item':
                    return `<ol><li>${renderRichText(value.rich_text)}</li></ol>`;
                case 'quote':
                    return `<blockquote>${renderRichText(value.rich_text)}</blockquote>`;
                case 'code':
                    return `<pre><code>${renderRichText(value.rich_text)}</code></pre>`;
                case 'image':
                    const imgUrl = value.type === 'external' ? value.external.url : value.file.url;
                    return `<img src="${imgUrl}" alt="Article Image" />`;
                case 'divider':
                    return `<hr style="border: 0; border-top: 1px solid var(--border); margin: 2rem 0;">`;
                default:
                    return '';
            }
        }

        async function loadArticle() {
            const container = document.getElementById('postContainer');
            const urlParams = new URLSearchParams(window.location.search);
            const pageId = urlParams.get('id');

            if (!pageId) {
                container.innerHTML = `
                    <div class="status-message" style="color: #ef4444;">
                        <i class="fa-solid fa-triangle-exclamation"></i> No article ID found in URL.
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch(`${WORKER_URL}?id=${pageId}`);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.message || "Failed to load post");
                }

                const blocks = data.results || [];
                const pageProps = data.properties || {};

                const title = pageProps.Name?.title[0]?.plain_text || pageProps.Title?.title[0]?.plain_text || "Untitled Article";
                const dateRaw = pageProps.Date?.date?.start || "";
                let formattedDate = "";
                if (dateRaw) {
                    formattedDate = new Date(dateRaw).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                }

                document.title = `${title} | Dr. Kunwar Mrityunjai Sharma`;

                const contentHtml = blocks.map(renderBlock).join('');

                container.innerHTML = `
                    <header class="post-header">
                        ${formattedDate ? `<div class="post-meta">${formattedDate}</div>` : ''}
                        <h1 class="post-title">${title}</h1>
                    </header>
                    <article class="post-content">
                        ${contentHtml || '<p>No written body content found in this Notion page.</p>'}
                    </article>
                `;

            } catch (err) {
                console.error("Error loading article:", err);
                container.innerHTML = `
                    <div class="status-message" style="color: #ef4444;">
                        <i class="fa-solid fa-triangle-exclamation"></i> Unable to load article content.
                    </div>
                `;
            }
        }

        document.addEventListener("DOMContentLoaded", loadArticle);
    </script>
</body>
</html>
